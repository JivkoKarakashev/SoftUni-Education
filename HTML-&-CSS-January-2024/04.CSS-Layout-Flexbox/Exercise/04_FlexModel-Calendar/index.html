<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <title>Calendar</title>
</head>

<body>

    <div class="container">

        <section class="week">
            <span class="working-days">Workweek</span>
            <div class="row-wrapper">
                <span class="work">1 Monday</span>
                <span class="work">2 Thuesday</span>
                <span class="work">3 Wednesday</span>
                <span class="work">4 Thursday</span>
                <span class="work">5 Friday</span>
            </div>
            <span class="days-off">Weekend</span>
            <div class="row-wrapper">
                <span class="off">6 Saturday</span>
                <span class="off">7 Sunday</span>
            </div>
        </section>

        <section class="notes">
            <span>REMINDERS</span>
            <span>SPECIAL DATES</span>
        </section>

    </div>

</body>

</html>
