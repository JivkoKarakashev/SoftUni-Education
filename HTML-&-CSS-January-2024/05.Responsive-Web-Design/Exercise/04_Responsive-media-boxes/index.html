<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="#" type="image/x-icon">
    <link rel="stylesheet" href="responsive.css">
    <title>Responsive Media Boxes</title>
</head>
<body>
    <section class="card">
        <div class="media">
            <img src="picture1.jpg" alt="image">
        </div>

        <div class="description">
            <header>
                <h1>Card Title</h1>
            </header>
            <main>
                <p>Short description of what this is all about - crafted to make people interested</p>
            </main>
            <footer>
                <a class="button" href="#">See more</a>
            </footer>
        </div>
    </section>
</body>
</html>
