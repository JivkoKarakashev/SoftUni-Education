<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Buttons CSS</title>
</head>

<body>
    <!-- <article> -->
        <header>
            <h2>Normal Buttons</h2>
        </header>
        <a class="button" href="#">Learn More</a>
        <button type="button" class="button">Learn More</button>
        <button type="button" class="button hover">Learn More</button>
    <!-- </article> -->

    <!-- <article> -->
        <header>
            <h2>Filled Buttons</h2>
        </header>
        <a class="button fill" href="#">Learn More</a>
        <button type="button" class="button fill">Learn More</button>
        <button type="button" class="button fill hover">Learn More</button>
    <!-- </article> -->

    <!-- <article> -->
        <header>
            <h2>Icon buttons</h2>
        </header>
        <a class="button fill" href="#"><i class="icon fa fa-download"></i>Download</a>
        <button type="button" class="button fill"><i class="icon fa fa-download"></i>Download</button>
        <button type="button" class="button fill hover"><i class="icon fa fa-download"></i>Download</button>
    <!-- </article> -->
</body>

</html>
